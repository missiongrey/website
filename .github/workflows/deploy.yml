name: Deploy to GitHub Pages

# Every push to main rebuilds and publishes missiongrey.com.
# Run it by hand from the Actions tab when you need a rebuild without a
# code change (for example right after setting the GA_MEASUREMENT_ID
# repository variable).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already in progress is left to finish so
# the live site is never served from a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the production tree
        env:
          # Repository variable. While it is unset the build leaves the
          # placeholder token in place and analytics stays switched off.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: bash deploy/build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/prod

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
